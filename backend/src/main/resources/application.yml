server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/agua_sarah?createDatabaseIfNotExist=true&serverTimezone=America/Fortaleza
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    # precisa ficar true: o JacksonConfig usa FORCE_LAZY_LOADING para resolver
    # relacionamentos LAZY do Hibernate durante a serializacao JSON, o que exige
    # a sessao ainda aberta nesse momento (com false, ela ja fecha antes disso e
    # gera "could not initialize proxy - no Session" em qualquer entidade com
    # relacionamento LAZY, como Venda.itens)
    open-in-view: true

app:
  jwt:
    secret: "troque-esta-chave-secreta-em-producao-para-uma-bem-mais-longa-e-aleatoria"
    expiration-ms: 28800000 # 8 horas

  seed:
    admin-login: admin
    admin-senha: admin123
